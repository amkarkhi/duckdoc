{{ define "layout" }}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuckDoc — {{ .Title }}</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ .BasePath }}/static/duckdoclogo.ico"
    />
    <script>
      try {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="{{ .BasePath }}/static/styles.css" />
    <script src="{{ .BasePath }}/static/sidebar.js" defer></script>
  </head>
  <body class="drawio-view">
    <nav class="navbar">
      <div class="navbar-left">
        <button
          class="sidebar-toggle"
          onclick="toggleSidebar()"
          title="Toggle sidebar"
        >
          <span id="sidebar-icon">☰</span>
        </button>
        <div class="navbar-logo">
          <div class="navbar-logo-icon">
            <img
              src="{{ .BasePath }}/static/duckdoclogo.ico"
              alt="DuckDoc Logo"
              class="logo-svg"
            />
          </div>
          <span>DuckDoc</span>
        </div>
        <div class="navbar-file-path">
          <span class="file-name"
            >{{ if .CurrentFile }}{{ .CurrentFile }}{{ else }}Diagram{{ end }}</span
          >
        </div>
      </div>
      <div class="navbar-right">
        <button
          class="theme-toggle"
          onclick="toggleTheme()"
          title="Toggle theme"
        >
          <span id="theme-icon">🌙</span>
        </button>
        <a href="{{ .BasePath }}/" class="navbar-home-link">Home</a>
      </div>
    </nav>
    {{ template "sidebar.html" . }}
    <main class="content drawio-container">
      <div class="drawio-toolbar">
        <!-- Page tabs collapse to a <select> under 640px; both are always in
             the DOM and the stylesheet shows exactly one. -->
        <div class="drawio-pages" id="drawio-pages"></div>
        <label class="drawio-pages-select-wrap" id="drawio-pages-select-wrap" hidden>
          <span class="visually-hidden">Diagram page</span>
          <select class="drawio-pages-select" id="drawio-pages-select"></select>
        </label>

        <div class="drawio-actions">
          <div class="drawio-zoom" role="group" aria-label="Zoom">
            <button class="drawio-btn" id="drawio-zoom-out" title="Zoom out (−)" aria-label="Zoom out">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg>
            </button>
            <button class="drawio-btn drawio-zoom-level" id="drawio-zoom-reset" title="Reset zoom to 100%" aria-label="Reset zoom">100%</button>
            <button class="drawio-btn" id="drawio-zoom-in" title="Zoom in (+)" aria-label="Zoom in">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
            </button>
          </div>

          <button class="drawio-btn" id="drawio-fit" title="Fit diagram to view (F)" aria-label="Fit to view">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H2.5V6M10 2.5h3.5V6M6 13.5H2.5V10M10 13.5h3.5V10"/></svg>
            <span class="drawio-btn-label">Fit</span>
          </button>

          <button class="drawio-btn" id="drawio-fullscreen" title="Fullscreen (V)" aria-label="Toggle fullscreen">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
            <span class="drawio-btn-label">Full</span>
          </button>

          <a
            class="drawio-btn"
            href="{{ .BasePath }}/content/{{ .CurrentFile }}"
            download
            title="Download the .drawio source"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M2.5 13.5h11"/></svg>
            <span class="drawio-btn-label">Source</span>
          </a>
        </div>
      </div>
      <div class="drawio-stage" id="drawio-stage">
        <div id="drawio-diagram" class="drawio-diagram" data-src="{{ .BasePath }}/content/{{ .CurrentFile }}">
          <div class="drawio-loading" role="status">
            <span class="drawio-spinner" aria-hidden="true"></span>
            <span>Loading diagram…</span>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Point the viewer at the vendored assets. These must be set before
      // drawio-viewer.min.js loads: it initialises each path with `||`, so a
      // value assigned here wins and nothing is fetched from diagrams.net.
      // Without them, stencil-based shapes (AWS, Cisco, electrical…) render
      // blank wherever the browser has no outbound internet.
      window.STENCIL_PATH = "{{ .BasePath }}/static/drawio/stencils";
      window.SHAPES_PATH = "{{ .BasePath }}/static/drawio/shapes";
      window.IMAGE_PATH = "{{ .BasePath }}/static/drawio/images";
      window.GRAPH_IMAGE_PATH = "{{ .BasePath }}/static/drawio/images";
      window.STYLE_PATH = "{{ .BasePath }}/static/drawio/styles";
      window.mxImageBasePath = "{{ .BasePath }}/static/drawio/mxgraph/images";
      window.mxBasePath = "{{ .BasePath }}/static/drawio/mxgraph";
      window.mxLoadStylesheets = false;
      // MathJax is only pulled in for diagrams with math="1". Point it at a
      // local path so that even those never reach out to diagrams.net (the
      // bundle is not vendored, so math typesetting simply no-ops offline).
      window.DRAW_MATH_URL = "{{ .BasePath }}/static/drawio/math";
    </script>
    <script src="{{ .BasePath }}/static/drawio-viewer.min.js"></script>
    <script src="{{ .BasePath }}/static/drawio-init.js" defer></script>
  </body>
</html>
{{ end }}
